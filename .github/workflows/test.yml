name: ATINA II tests

on:
  push:
    branches:
      - main
      - docs/atina-ii-foundation
      - feat/game-core
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
